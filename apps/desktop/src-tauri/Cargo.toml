[package]
name = "ort-desktop"
version.workspace = true
description = "Open Resume Toolkit desktop shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ort_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
dev-browser-bridge = ["ort-ipc/dev-browser-bridge"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
schemars.workspace = true
ort-application = { path = "../../../crates/ort-application" }
ort-backup = { path = "../../../crates/ort-backup" }
ort-render = { path = "../../../crates/ort-render" }
base64.workspace = true
uuid.workspace = true
url.workspace = true
ort-documents = { path = "../../../crates/ort-documents" }
ort-platform = { path = "../../../crates/ort-platform" }
ort-domain = { path = "../../../crates/ort-domain" }
ort-ipc = { path = "../../../crates/ort-ipc" }
ort-storage = { path = "../../../crates/ort-storage" }
ort-vault = { path = "../../../crates/ort-vault" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
ort-ai = { path = "../../../crates/ort-ai" }
reqwest.workspace = true
tokio.workspace = true
jiff.workspace = true
tempfile.workspace = true
sha2.workspace = true
hex.workspace = true
flate2.workspace = true
rustix.workspace = true
ort-codex-install = { path = "../../../crates/ort-codex-install" }

[target.'cfg(target_os = "macos")'.dependencies]
ort-macos-lifecycle = { path = "../../../crates/ort-macos-lifecycle" }
drag = "2.1.1"

[dev-dependencies]
ort-vault = { path = "../../../crates/ort-vault", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
