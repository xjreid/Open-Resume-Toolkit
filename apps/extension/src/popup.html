<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Resume Toolkit capture</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font: 14px system-ui;
        background: #f5f7fa;
        color: #183356;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.4;
      }
      button {
        width: 100%;
        margin: 5px 0;
        padding: 10px;
        border: 1px solid #183356;
        border-radius: 6px;
        background: #183356;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      #status {
        min-height: 38px;
      }
    </style>
  </head>
  <body>
    <h1>Capture selection</h1>
    <p>
      Select the relevant text on the page, then choose where to review it in
      ORT.
    </p>
    <button id="job" type="button">Job description</button
    ><button id="question" type="button">Application question</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
