name: Secret scanning

on:
  pull_request:
  push:
  schedule:
    - cron: "43 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Source and full Git history
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install checksum-verified scanner
        run: python3 tools/install-gitleaks.py
      - name: Scan current source and archives
        run: node tools/check-secrets.mjs
      - name: Scan all fetched branches and tags
        run: node tools/check-secrets.mjs --history
