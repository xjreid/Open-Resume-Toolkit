name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contracts, tests, and security checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify deterministic DOCX checkout policy
        run: node --test tools/tests/docx-checkout.test.mjs

      - name: Use pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Use pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated contracts
        run: cargo run --locked -p ort-contract-generator && git diff --exit-code -- packages/contracts/generated

      - name: Check formatting
        run: pnpm format:check && cargo fmt --all --check

      - name: Run JavaScript checks
        run: pnpm lint && pnpm test && pnpm build && pnpm check:security

      - name: Run Rust checks
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings && cargo test --workspace --all-targets --locked

      - name: Independently verify generated DOCX packages and semantics
        run: cargo run --locked -p ort-documents --example docx_fixtures -- target/docx-ci-fixtures && python3 tools/verify-docx-fixtures.py target/docx-ci-fixtures

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high --prod

      - name: Independently verify PDF bytes, text, geometry, tags and links
        run: cargo run --locked -p ort-render --example pdf_fixtures -- target/pdf-ci-fixtures && node tools/verify-pdf-fixtures.mjs target/pdf-ci-fixtures

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify deterministic DOCX checkout policy
        run: node --test tools/tests/docx-checkout.test.mjs

      - name: Use pinned pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Use pinned Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and Rust desktop shell
        id: desktop-build
        run: pnpm --filter @ort/desktop build && cargo check --locked -p ort-desktop

      - name: Diagnose native SQLCipher startup on the target OS
        run: cargo test --locked -p ort-storage --test native_startup -- --nocapture

      - name: Measure macOS sandbox and hard limits (import remains disabled)
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.desktop-build.outcome == 'success' }}
        run: node tools/probe-document-sandbox-macos.mjs

      - name: Test macOS child cancellation, timeout, and bounded output
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.desktop-build.outcome == 'success' }}
        run: node tools/probe-document-lifecycle-macos.mjs

      - name: Test storage, import review, text output, and filesystem safety on the target OS
        # Keep the original cold-start/concurrent test process even if the
        # separate startup probe crashes. Neither failure is ignored or masked.
        if: ${{ !cancelled() && steps.desktop-build.outcome == 'success' }}
        run: cargo test --locked -p ort-domain -p ort-documents -p ort-render -p ort-desktop -p ort-document-worker -p ort-application -p ort-platform -p ort-storage -- --nocapture

      - name: Independently verify DOCX output on the target OS
        if: ${{ !cancelled() && steps.desktop-build.outcome == 'success' }}
        shell: bash
        run: cargo run --locked -p ort-documents --example docx_fixtures -- target/docx-ci-fixtures && ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/verify-docx-fixtures.py target/docx-ci-fixtures

      - name: Independently verify PDF output on the target OS
        if: ${{ !cancelled() && steps.desktop-build.outcome == 'success' }}
        shell: bash
        run: cargo run --locked -p ort-render --example pdf_fixtures -- target/pdf-ci-fixtures && node tools/verify-pdf-fixtures.mjs target/pdf-ci-fixtures
