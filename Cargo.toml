[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/ort-backup",
    "crates/ort-application",
    "crates/ort-ai",
    "crates/ort-contract-generator",
    "crates/ort-document-worker",
    "crates/ort-documents",
    "crates/ort-domain",
    "crates/ort-ipc",
    "crates/ort-native-host",
    "crates/ort-platform",
    "crates/ort-render",
    "crates/ort-storage",
    "crates/ort-vault",
]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/xjreid/Open-Resume-Toolkit"

[workspace.dependencies]
cap-std = "=4.0.3"
cap-primitives = "=4.0.3"
crc32fast = "=1.5.1"
flate2 = "=1.1.10"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
jiff = "=0.2.35"
keyring = { version = "=4.2.0", default-features = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
schemars = { version = "1.0.4", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
quick-xml = "=0.41.0"
pdfium-render = { version = "=0.9.3", default-features = false, features = ["pdfium_7881"] }
sha2 = "=0.11.0"
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-dialog = "=2.7.2"
tempfile = "=3.27.0"
thiserror = "2.0.17"
url = "=2.5.8"
uuid = { version = "=1.24.1", features = ["serde", "v7"] }
zeroize = "=1.9.0"
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-layout = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
comemo = "=0.5.1"
base64 = "=0.22.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = "symbols"
